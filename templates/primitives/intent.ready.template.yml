schema: ready/primitive/v1
kind: primitive
id: I-001
class: intent
type: "{{promise|behavior|workflow|module|component|capability|experience|quality|safety|failure}}"
compiler_role: source_truth
title: "{{INTENT_TITLE}}"
status: draft
fields:
  statement: "{{AS_ACTOR_I_CAN_OUTCOME_SO_VALUE}}"
  claim_level: "{{concept|process_proof|simulation_baseline|fixture_validated|human_labeled_validated|production_monitored}}"
  actor: "{{PRIMARY_ACTOR}}"
  trigger: "{{WHEN_THIS_PROMISE_STARTS}}"
  action: "{{WHAT_THE_ACTOR_OR_SYSTEM_DOES}}"
  expected_end_state: "{{OBSERVABLE_DONE_STATE}}"
  value: "{{WHY_THIS_MATTERS}}"
  scope: "{{WHAT_IS_INCLUDED}}"
  non_scope: "{{WHAT_IS_EXCLUDED}}"
  failure_behavior: "{{WHAT_HAPPENS_WHEN_IT_CANNOT_WORK}}"
  process_decision: "{{CURRENT_PROCESS_OR_NONE}}"
  required_surfaces: "{{USER_OPERATOR_OR_INTERNAL_SURFACES_REQUIRED}}"
  operating_envelope: "{{QUALITY_OR_LIVE_VARIABLE_OPERATING_LIMITS_OR_NONE}}"
# Proof cases own the durable IO and proof contract. Cases group one or more proof pairs; pairs are the counted unit.
proof_cases:
  - key: "{{case-stable-slug}}"
    kind: "{{unit|integration|manual|monitored}}"
    title: "{{HUMAN_READABLE_CASE_TITLE}}"
    pairs:
      - key: "{{pair-stable-slug}}"
        inputs: ["{{ARTIFACT_OR_SERVICE_IDS_USED_AS_INPUTS}}"]
        output:
          artifacts: ["{{ARTIFACT_IDS_EXPECTED_OR_PRODUCED}}"]
          logic: "{{WHAT_MUST_BE_TRUE_ABOUT_THE_OUTPUT_FOR_THIS_PAIR_TO_PASS}}"
refs: []
artifacts: []
owner_notes: []
