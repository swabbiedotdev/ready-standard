schema: "ready/artifact-tree/v1"
kind: "manifest"
class: "artifact"
artifact_root: "{{SCOPE_PATH}}/artifacts"
artifact_index: "{{SCOPE_PATH}}/artifacts.md"
artifact_type_directory_base: "artifact_root"
descriptor_required_top_level:
  - schema
  - kind
  - id
  - class
  - type
  - compiler_role
  - title
  - status
  - refs
descriptor_required_fields:
  - confidence
  - provenance
  - purpose
  - content
  - intended_use
  - format
file_backed_required_file_fields:
  - path
  - role
artifact_class: "artifact"
artifact_types:
  customer_statement:
    id_prefix: "AR"
    directory: "resources/"
    validation: "yaml_parse"
    privacy: "user_provided_customer_statement_or_sanitized_excerpt_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - statement
      - speaker_type
  source_document:
    id_prefix: "AR"
    directory: "resources/"
    validation: "markdown_json_yaml_or_external_ref"
    privacy: "safe_ref_or_public_resource_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - source_kind
  reference_resource:
    id_prefix: "AR"
    directory: "resources/"
    validation: "markdown_json_yaml_or_external_ref"
    privacy: "safe_ref_or_public_resource_or_sanitized_fixture_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
  access_reference:
    id_prefix: "AR"
    directory: "resources/"
    validation: "yaml_parse"
    privacy: "safe_ref_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - access_scope
  review_protocol:
    id_prefix: "AR"
    directory: "resources/"
    validation: "yaml_parse"
    privacy: "safe_ref_or_public_resource_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - protocol_scope
  proof_corpus:
    id_prefix: "AP"
    directory: "samples/"
    validation: "yaml_json_jsonl_or_external_ref"
    privacy: "sanitized_fixture_or_explicit_user_stub_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - proof_role
      - authority_level
      - proof_of
      - satisfies
      - git_commit
      - lifecycle_state
      - coverage
      - dataset_contract
      - oracle_policy
      - replay
      - acceptance_contract
      - limitations
  code_snippet:
    id_prefix: "ASN"
    directory: "snippets/"
    validation: "markdown_or_text"
    privacy: "safe_ref_or_public_resource_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - snippet_scope
  design_artifact:
    id_prefix: "AD"
    directory: "designs/"
    validation: "external_or_binary_ref"
    privacy: "safe_ref_or_public_resource_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - design_scope
  manifest:
    id_prefix: "AM"
    directory: "manifests/"
    validation: "json_or_yaml_parse"
    privacy: "safe_ref_or_public_resource_or_private_ref"
    required_fields:
      - confidence
      - provenance
      - purpose
      - content
      - intended_use
      - format
      - manifest_scope
rules:
  - "Artifact descriptors are primitives with kind: primitive and class: artifact."
  - "Artifact descriptors support product logic, flags, proof, or generated views."
  - "One descriptor records one artifact purpose; do not bundle files with different purposes into the same descriptor."
  - "A descriptor may list multiple files only when those files are interchangeable versions or representations of the same purpose."
  - "Every referenced payload file that is not itself a .ready.yml source record and supports product logic, flags, proof, generated views, or handoff should be represented by a descriptor."
  - "Large, binary, private, or generated payload files are attachments or safe refs, not primitive records themselves."
  - "Governance documents and vendored Ready Standard bundle resources do not live under artifacts and do not require artifact descriptors."
  - "Artifact type manifest describes a durable artifact manifest; kind: manifest describes structural Ready metadata."
